# celld-perf: the macro performance harness (docs/performance-tests.md).
# It starts celld nodes as subprocesses, drives them with open-loop HTTP and
# WebSocket load, reads each node's /debug/metrics, and writes one JSON
# result per run. It links no celld code, so it builds without V8.
[package]
name = "celld-perf"
version = "0.0.0"
edition = "2021"
rust-version = "1.94.1"
license = "Apache-2.0"
publish = false

[[bin]]
name = "celld-perf"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bytes.workspace = true
fastwebsockets = { workspace = true, features = ["upgrade", "unstable-split"] }
futures-util.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
libc.workspace = true
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
