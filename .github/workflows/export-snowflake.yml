name: Export Snowflake

# The change export's Snowflake side: the crate's Rust (with the loader's
# `sql-api`, `blob-stream` and `kafka` features), then its SQL and the
# celld-export-loader binary against the Snowflake emulator in
# crates/export-snowflake/sqltest. The
# emulator tests need Python and fakesnow, which the main CI job does not
# install, so they run here, and only when the crates they test change.
on:
  pull_request:
    paths:
      - crates/export-snowflake/**
      - crates/export-format/**
      - .github/workflows/export-snowflake.yml
  push:
    branches:
      - main
    paths:
      - crates/export-snowflake/**
      - crates/export-format/**
      - .github/workflows/export-snowflake.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-snowflake-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: 1.97.1
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Rust and emulator tests
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    # A single-node Kafka for the loader's Kafka consumer tests against a real
    # broker (CELLD_TEST_KAFKA_BROKERS); without it they skip.
    services:
      kafka:
        image: apache/kafka:3.9.1
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_VERSION"

      # The blob-stream feature's consumer generates its protobuf code at
      # build time; the same pinned protoc as the main CI job.
      - name: Install protoc
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/protoc.zip" \
            https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip
          sudo unzip -q -o "$RUNNER_TEMP/protoc.zip" -d /usr/local bin/protoc 'include/*'
          protoc --version

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Format
        run: cargo fmt -p celld-export-snowflake -p celld-export-format --check

      - name: Clippy
        run: cargo clippy -p celld-export-snowflake -p celld-export-format --all-targets --all-features --locked -- -D warnings

      - name: Test
        env:
          CELLD_TEST_KAFKA_BROKERS: localhost:9092
        run: cargo test -p celld-export-snowflake -p celld-export-format --all-features --locked

      # The SQL against synthetic records, and the loader binary end to end
      # against an SQL API emulator. See the crate's README.
      - name: Emulator tests
        run: sh crates/export-snowflake/sqltest/run.sh
