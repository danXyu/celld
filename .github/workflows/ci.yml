name: CI

# Every pull request must format, lint, build and test cleanly before it
# merges. These are the checks the Dockerfile test stage runs, run natively
# on the dev profile with a dependency cache so a PR gets an answer without
# the release profile's fat-LTO relink. Pushes to main keep the cache warm:
# a pull request can restore caches saved on its base branch but not on
# another pull request's branch.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: 1.97.1
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt
          rustup default "$RUST_VERSION"

      - run: cargo fmt --all --check

  check:
    name: Lint and test
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
          rustup default "$RUST_VERSION"

      # The ltx fault-injection oracle diffs databases with the sqlite3 CLI.
      - name: Install sqlite3
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sqlite3

      # The export-blob-stream feature's client generates its protobuf code at
      # build time. The runner's apt protoc is too old for proto3 optional
      # fields and lacks the well-known types, so use a pinned release.
      - name: Install protoc
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/protoc.zip" \
            https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip
          sudo unzip -q -o "$RUNNER_TEMP/protoc.zip" -d /usr/local bin/protoc 'include/*'
          protoc --version

      - uses: Swatinem/rust-cache@v2
        with:
          # Saving from pull requests would only fill the repository's cache
          # quota with entries no other pull request can restore.
          save-if: ${{ github.event_name != 'pull_request' }}

      # rust-cache removes gn_out but keeps V8's build-script fingerprints.
      # Without the native archive, a later v8 recompile skips its download
      # and fails to link. Invalidate only V8 when those cached outputs are missing.
      - name: Repair incomplete V8 build cache
        run: |
          set -euo pipefail
          if [[ ! -s target/debug/gn_out/obj/librusty_v8.a ]]; then
            rm -f target/debug/gn_out/obj/librusty_v8.sum
            cargo clean --locked -p v8
          fi

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # Optional features (the ltx object-store backends, and later the
      # export transports) must keep compiling even though the default
      # build leaves them off.
      - name: Clippy, all features
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      # The blob-stream sink's own tests, with its client compiled in.
      - name: Test, blob-stream sink
        run: cargo test --locked -p celld --features export-blob-stream --lib export_blob_stream

      # Check fixtures and benchmark paths without timing gates on shared runners.
      - name: Smoke test export benchmarks
        run: |
          cargo test -p celld-export-format --bench export_format --locked -- --test
          cargo test -p celld --features export-bench --bench export_pipeline --locked -- --test
